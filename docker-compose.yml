version: '3.8'

services:
  ai-triage:
    build: 
      context: .
      dockerfile: Dockerfile
    env_file:
      # Loads LLM_PROVIDER, OLLAMA_MODEL, OPENAI_API_KEY, etc. straight from
      # the same .env file config.py reads
      - .env
    environment:
      # Overrides whatever OLLAMA_BASE_URL is in .env — "localhost" inside
      # the container is NOT your host machine, host.docker.internal is
      - OLLAMA_BASE_URL=http://host.docker.internal:11434/v1
    extra_hosts:
      # Required for Linux/WSL to resolve host.docker.internal
      - "host.docker.internal:host-gateway"
    volumes:
      # Mount the processed data folder so we don't have to rebuild the image if logs change
      - ./data/processed:/app/data/processed

