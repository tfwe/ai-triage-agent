name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Run the test suite
        # Every test builds its own scratch data. No model, no GPU, no API key,
        # no network: the corpus is rendered and parsed inside the tests.
        run: python -m pytest

  replay-eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Replay the recorded agent run
        # Replays eval/recordings/agent.jsonl from the last live run and fails
        # if the numbers drift from eval/results/agent.json.
        run: python -m eval.run_evals --mode replay --label ci-replay

      - name: Replay the committed holdout recording
        # Replays eval/recordings/public-ornith-r3-holdout.jsonl against the
        # 14 holdout case databases committed under data/public/cases. Offline,
        # no model, no API key. Label is distinct from the synthetic replay.
        env:
          LLM_MODE: replay
          REPLAY_PATH: eval/recordings/public-ornith-r3-holdout.jsonl
        run: >-
          python -m eval.run_evals --mode replay
          --dataset eval/datasets/public.json --split holdout
          --cases-dir data/public/cases --no-build
          --label ci-replay-ornith-r3
